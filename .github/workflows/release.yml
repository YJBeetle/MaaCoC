name: 打包

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  MAA_VERSION: v5.14.0-beta.1

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 拉取 MaaFramework
        run: ./scripts/fetch-sdk.sh

      - name: 安装前端依赖
        run: npm ci
        working-directory: app

      - name: 打包
        working-directory: app
        run: ./node_modules/.bin/tauri build --bundles "${{ matrix.bundles }}"

      - name: 检查产物里确实带了资源和运行库
        run: ./scripts/verify-bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: maacoc-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/**/*.{dmg,exe,deb,AppImage}
