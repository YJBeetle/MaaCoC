[env]
# The maa-framework build script needs the official SDK (headers + dylibs).
# It is vendored per-platform and never committed; see scripts/fetch-sdk.sh.
MAA_SDK_PATH = { value = "vendor", relative = true }

# Ship-time layout: the MaaFramework libraries sit next to the executable while
# developing (scripts/sync-libs.sh copies them there), and land in the bundle's
# resource directory once packaged, which the second rpath covers.
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,@executable_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Resources",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,@executable_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Resources",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../lib",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../lib",
]
